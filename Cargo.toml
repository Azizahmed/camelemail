[workspace]
resolver = "2"
members = ["crates/remail-proto", "crates/remail-core", "crates/remail-server", "src-tauri"]

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "MIT"
authors = ["Aziz <gotoaziz100@gmail.com>"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "process"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
