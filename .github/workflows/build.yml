# Builds Remail for Linux (.deb, AppImage), Windows (installer .exe, .msi)
# and macOS (universal .dmg for Apple silicon and Intel).
#
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.9:
# a tag also puts the files on a draft GitHub release.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Tag builds put the installers on a draft release.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            args: ""
          - name: windows
            os: windows-latest
            args: ""
          - name: macos
            os: macos-latest
            args: "--target universal-apple-darwin"
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - run: pnpm install --frozen-lockfile

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Only tags make a (draft) release; manual runs keep the files as artifacts.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Remail ${{ github.ref_name }}
          releaseDraft: true

      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: remail-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
