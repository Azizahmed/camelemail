[package]
name = "remail-server"
description = "Remail server: accounts, sign-in, encrypted settings sync and org config"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "remail-server"
path = "src/main.rs"

[features]
# `remail_server::testing`: the server in-process, for end-to-end tests elsewhere.
testing = []

[dependencies]
remail-proto = { path = "../remail-proto" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "ws", "query", "form", "macros"] }
tower-http = { version = "0.6", features = ["trace"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "macros", "chrono", "uuid", "json"] }
argon2 = { version = "0.5", features = ["std"] }
aes-gcm = { version = "0.10", features = ["std"] }
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
base64 = "0.22"
totp-rs = "5"
zxcvbn = "3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-native-certs", "ring", "hostname"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
ed25519-dalek = "2"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "form"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio-tungstenite = "0.26"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
